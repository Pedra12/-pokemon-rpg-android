name: Build Guardian Monsters Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project and game source/assets
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply game identity and Brazilian Portuguese overlay
        run: python3 scripts/apply_customizations.py

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3"
          yes | sdkmanager --licenses

      - name: Set up Java for legacy Gradle project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "6.7.1"

      - name: Build Android APK
        working-directory: GuardianMonsters/GuardianMonsters
        run: gradle --no-daemon :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-monsters-android-debug
          path: GuardianMonsters/GuardianMonsters/android/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
