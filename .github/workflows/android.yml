name: Build Android APK
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract Android project ZIP
        run: |
          mkdir project
          unzip -o pokemon-rpg-android.zip -d project
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p project :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rpg-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
