name: Build Guardian Monsters Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout open-source RPG base
        uses: actions/checkout@v4
        with:
          repository: lucidtanooki/guardian_monsters
          ref: main
          path: upstream/guardian_monsters

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "6.7.1"

      - name: Build Android APK
        working-directory: upstream/guardian_monsters/GuardianMonsters
        run: gradle --no-daemon :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-monsters-android-debug
          path: upstream/guardian_monsters/GuardianMonsters/android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: warn
          retention-days: 14
